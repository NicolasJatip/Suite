services:
  suite:
    build:
      context: ./server
    image: suite-transcrip:local
    restart: unless-stopped
    # Sin root: el proceso corre con este UID/GID, que debe ser el duenio de ./data en el host
    user: "${SUITE_UID:-1000}:${SUITE_GID:-1000}"
    environment:
      APP_NAME: ${SUITE_APP_NAME:-Suite}
      PUBLIC_URL: ${SUITE_PUBLIC_URL:-http://localhost:8000}
      ADMIN_USER: ${SUITE_ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${SUITE_ADMIN_PASSWORD:?Falta SUITE_ADMIN_PASSWORD en .env}
      SESSION_SECRET: ${SUITE_SESSION_SECRET:?Falta SUITE_SESSION_SECRET en .env}
      STORAGE_DIR: /data
      HF_HOME: /data/models
      XDG_CACHE_HOME: /data/cache
      MAX_UPLOAD_GB: ${SUITE_MAX_UPLOAD_GB:-10}
      MARKITDOWN_MAX_UPLOAD_MB: ${SUITE_MARKITDOWN_MAX_UPLOAD_MB:-512}
      CHUNK_SIZE_MB: ${SUITE_CHUNK_SIZE_MB:-16}
      JOB_CONCURRENCY: ${SUITE_JOB_CONCURRENCY:-1}
      RETENTION_DAYS: ${SUITE_RETENTION_DAYS:-}
      TRANSCRIP_MODEL: ${SUITE_MODEL:-small}
      TRANSCRIP_LANGUAGE: ${SUITE_LANGUAGE:-es}
      TRANSCRIP_COMPUTE_TYPE: ${SUITE_COMPUTE_TYPE:-int8}
      TRANSCRIP_DEVICE: ${SUITE_DEVICE:-cpu}
      GOOGLE_DOCS_ENABLED: ${SUITE_GOOGLE_DOCS_ENABLED:-false}
      GOOGLE_SERVICE_ACCOUNT_KEY: ${SUITE_GOOGLE_SERVICE_ACCOUNT_KEY:-/data/google-service-account.json}
    ports:
      - "${SUITE_PORT:-8000}:8000"
    volumes:
      # Datos: sqlite, videos, transcripciones y cache del modelo whisper
      - ./data:/data
      # Codigo de la extension: /extension/transcrip-recorder.zip lo empaqueta al vuelo
      - ./extension:/extension:ro
